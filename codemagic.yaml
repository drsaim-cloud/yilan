workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 40
    environment:
      node: 20.11.0
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Add Capacitor Android platform
        script: |
          npx cap add android || true
          npx cap sync android

      - name: Set SDK path
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Make gradlew executable
        script: chmod +x android/gradlew

      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  android-release:
    name: Android Release APK
    max_build_duration: 60
    environment:
      node: 20.11.0
      java: 17
      groups:
        - keystore_credentials
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Add Capacitor Android platform
        script: |
          npx cap add android || true
          npx cap sync android

      - name: Set SDK path
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Make gradlew executable
        script: chmod +x android/gradlew

      - name: Decode keystore
        script: |
          echo "$CM_KEYSTORE_BASE64" | base64 --decode > android/app/yilan-harf.keystore

      - name: Build release APK
        script: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$CM_BUILD_DIR/android/app/yilan-harf.keystore" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD" \
            --stacktrace

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab

    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
