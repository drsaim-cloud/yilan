workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    environment:
      android_signing:
        - keystore_reference   # CodeMagic > App Settings > Code Signing > Android altında tanımla
      vars:
        PACKAGE_NAME: "com.yilanharf.oyunu"
      node: 20.11.0
      java: 17
    scripts:
      - name: Install Node dependencies
        script: |
          npm install

      - name: Install Capacitor CLI
        script: |
          npm install -g @capacitor/cli

      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Set Android SDK path
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Make gradlew executable
        script: |
          chmod +x android/gradlew

      - name: Build Android release APK
        script: |
          cd android
          ./gradlew assembleRelease \
            -PKEYSTORE_FILE="$CM_KEYSTORE_PATH" \
            -PKEYSTORE_PASSWORD="$CM_KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$CM_KEY_ALIAS" \
            -PKEY_PASSWORD="$CM_KEY_PASSWORD"

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab

    publishing:
      email:
        recipients:
          - your@email.com   # buraya e-posta adresini yaz
        notify:
          success: true
          failure: true

  android-debug:
    name: Android Debug Build
    max_build_duration: 30
    environment:
      node: 20.11.0
      java: 17
    scripts:
      - name: Install Node dependencies
        script: npm install

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Sync Capacitor
        script: npx cap sync android

      - name: Set SDK path
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Make gradlew executable
        script: chmod +x android/gradlew

      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
